[project]
name = "tsfm-autoresearch"
version = "0.1.0"
description = "Empirical validation of per-request autoresearch over frozen TimesFM for multi-tenant resource forecasting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "torch>=2.2",
    "optuna>=3.5",
    "faiss-cpu>=1.8",
    "huggingface-hub>=0.20",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.3",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm_autoresearch", "src/baselines"]
